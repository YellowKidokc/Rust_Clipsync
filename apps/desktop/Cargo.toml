[package]
name = "clipsync"
version = "0.1.0"
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clip-core = { path = "../../crates/clip-core" }
clip-crypto = { path = "../../crates/clip-crypto" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
clipboard-rs = "0.3"
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
base64 = "0.22"
hex = "0.4"
zeroize = "1"
tempfile = "3"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "time", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
