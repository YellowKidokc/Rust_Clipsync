[package]
name = "clipsync"
version = "0.1.0"
description = "ClipSync desktop: tray app, hotkey picker, clipboard capture"
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
ureq = { version = "2", features = ["json"] }
regex = "1"
once_cell = "1"
enigo = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# Size: the installer target is <10 MB. These settings get the exe to ~4-6 MB.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
